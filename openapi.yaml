components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key (us_..., older re_...) or OAuth access token (usa_...).
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.usend.et/oauth/authorize
          tokenUrl: https://api.usend.et/oauth/token
          refreshUrl: https://api.usend.et/oauth/token
          scopes:
            full_access: Everything an API key with full access can do (includes sending).
            sending_access: Send email only.
      description: PKCE (S256) is mandatory; clients are public and register at /oauth/register.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      name: after
      in: query
      schema:
        type: string
        format: uuid
      description: Return rows older than this ID. Not with `before`.
    Before:
      name: before
      in: query
      schema:
        type: string
        format: uuid
      description: Return rows newer than this ID. Not with `after`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Replays the first response for 24 hours. 409 invalid_idempotency_key / concurrent_idempotent_requests on misuse.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Person:
      type: object
      properties:
        object: {type: string, const: person}
        id: {type: string}
        email: {type: string}
        first_name: {type: string}
        last_name: {type: string}
        company: {type: string}
        phone: {type: string}
        properties: {type: object, additionalProperties: true}
        source: {type: string}
        status: {type: string, enum: [active, unsubscribed, bounced, complained]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        last_emailed_at: {type: [string, 'null'], format: date-time}
        last_opened_at: {type: [string, 'null'], format: date-time}
        last_clicked_at: {type: [string, 'null'], format: date-time}
        emails_sent: {type: integer}
        opens: {type: integer}
        clicks: {type: integer}
        bounced: {type: boolean}
        complained: {type: boolean}
        unsubscribed: {type: boolean}
    PersonActivity:
      type: object
      properties:
        id: {type: string}
        type: {type: string}
        ref: {type: string}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        name:
          type: string
        message:
          type: string
      required:
      - statusCode
      - name
      - message
      description: Resend-compatible error. `name` is e.g. validation_error, missing_api_key, invalid_api_key, restricted_api_key, unauthorized,
        forbidden, not_found, rate_limit_exceeded, daily_quota_exceeded, recipient_rate_limit_exceeded, content_not_allowed, conflict, invalid_idempotency_key, concurrent_idempotent_requests, internal_server_error.
      additionalProperties: true
    List:
      type: object
      description: List envelope. Paginated lists also return has_more; rows are newest first.
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {}
        has_more:
          type: boolean
      required:
      - object
      - data
    Deleted:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
        deleted:
          type: boolean
      additionalProperties: true
    Attachment:
      type: object
      properties:
        filename:
          type: string
        content:
          type: string
          description: Base64 content.
        content_type:
          type: string
        content_id:
          type: string
          description: 'Makes the attachment inline: reference it as cid:<content_id>. Letters, digits, . _ - @, max 128.'
      required:
      - filename
      - content
      additionalProperties: true
    Tag:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
      - name
      - value
      additionalProperties: true
    SendEmailRequest:
      type: object
      properties:
        from:
          type: string
        to:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: String or array, max 50.
        subject:
          type: string
        html:
          type: string
        text:
          type: string
        cc:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        bcc:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        reply_to:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        headers:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        scheduled_at:
          type: string
          description: ISO 8601 or natural language such as 'in 1 hour' (UTC); max 30 days ahead.
        template:
          type: object
          properties:
            id:
              type: string
              description: Template ID or alias; the published version is used.
            variables:
              type: object
              additionalProperties: true
          required:
          - id
          additionalProperties: true
      required:
      - to
      additionalProperties: true
    SendEmailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
      additionalProperties: true
    BatchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SendEmailResponse'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: string
            additionalProperties: true
      required:
      - data
      additionalProperties: true
    EmailSummary:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        from:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
