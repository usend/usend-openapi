# OpenAPI 3.1 description of usend's public, API-key-authenticated API.
# Check coverage against backend/internal/api/server.go with scripts/check-openapi.py.
openapi: 3.1.0
info:
  title: usend API
  version: 1.2.0
  description: 'Public API of usend, a Resend-compatible email service. Authenticate with `Authorization: Bearer us_...` (API key) or `usa_...`
    (OAuth access token). `sending_access` keys may only call POST /emails and POST /emails/batch. Dashboard-session-only, admin and billing routes
    are not part of this document.'
  license:
    name: MIT
servers:
- url: https://api.usend.et
  description: Hosted; self-hosted platforms use https://api.<platform-domain>
security:
- bearerAuth: []
tags:
- name: People
  description: Org-wide person records with counters and a timeline.
- name: Emails
  description: Send and inspect email.
- name: Received emails
  description: Inbound mail.
- name: Domains
  description: Sending domains and DNS.
- name: API keys
- name: Templates
- name: Audiences
  description: Legacy audience-scoped contacts.
- name: Segments
- name: Contacts
- name: Contact properties
- name: Topics
- name: Broadcasts
- name: Webhooks
- name: Suppressions
- name: Events
  description: Custom events.
- name: Automations
- name: Short links
  description: Short URLs on the tracking host, with click statistics.
- name: Inboxes
  description: Shared mailboxes.
- name: Logs
- name: Stats
- name: Tools
- name: OAuth
paths:
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - OAuth
      operationId: getOAuthMetadata
      summary: Authorization server metadata (RFC 8414)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  registration_endpoint:
                    type: string
                  revocation_endpoint:
                    type: string
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  response_types_supported:
                    type: array
                    items:
                      type: string
                  grant_types_supported:
                    type: array
                    items:
                      type: string
                  code_challenge_methods_supported:
                    type: array
                    items:
                      type: string
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api-keys:
    post:
      tags:
      - API keys
      operationId: createApiKey
      summary: Create an API key
      description: Not available to OAuth tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permission:
                  type: string
                  enum:
                  - full_access
                  - sending_access
                domain_id:
                  type: string
              required:
              - name
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - API keys
      operationId: listApiKeys
      summary: List API keys
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /api-keys/{id}:
    patch:
      tags:
      - API keys
      operationId: updateApiKey
      summary: Update an API key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permission:
                  type: string
                  enum:
                  - full_access
                  - sending_access
                domain_id:
                  type:
                  - string
                  - 'null'
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: api_key
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - API keys
      operationId: deleteApiKey
      summary: Delete an API key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Error'
  /audiences:
    post:
      tags:
      - Audiences
      operationId: createAudience
      summary: Create an audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Audiences
      operationId: listAudiences
      summary: List audiences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Audience'
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /audiences/{aid}/contacts:
    post:
      tags:
      - Audiences
      operationId: createAudienceContact
      summary: Add a contact to an audience
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Audiences
      operationId: listAudienceContacts
      summary: List an audience's contacts
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  has_more:
                    type: boolean
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /audiences/{aid}/contacts/import:
    post:
      tags:
      - Audiences
      operationId: importAudienceContacts
      summary: Import contacts from CSV (synchronous)
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv:
                  type: string
              required:
              - csv
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        default:
          $ref: '#/components/responses/Error'
  /audiences/{aid}/contacts/{cid}:
    get:
      tags:
      - Audiences
      operationId: getAudienceContact
      summary: Retrieve a contact (ID or email)
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
      - name: cid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Audiences
      operationId: updateAudienceContact
      summary: Update a contact
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
      - name: cid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Audiences
      operationId: deleteAudienceContact
      summary: Delete a contact
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
      - name: cid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Error'
  /audiences/{id}:
    get:
      tags:
      - Audiences
      operationId: getAudience
      summary: Retrieve an audience
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Audiences
      operationId: deleteAudience
      summary: Delete an audience
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Error'
  /automations:
    post:
      tags:
      - Automations
      operationId: createAutomation
      summary: Create an automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Automations
      operationId: listAutomations
      summary: List automations
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Before'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - enabled
          - disabled
          - stopped
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Automation'
                  has_more:
                    type: boolean
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /automations/{id}:
    get:
      tags:
      - Automations
      operationId: getAutomation
      summary: Retrieve an automation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Automations
      operationId: updateAutomation
      summary: Update an automation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Automations
      operationId: deleteAutomation
      summary: Delete an automation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Error'
  /automations/{id}/duplicate:
    post:
      tags:
      - Automations
      operationId: duplicateAutomation
      summary: Duplicate as a draft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /automations/{id}/runs:
    get:
      tags:
      - Automations
      operationId: listAutomationRuns
      summary: List runs
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Before'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - running
          - completed
          - failed
          - cancelled
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutomationRun'
                  has_more:
                    type: boolean
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /automations/{id}/runs/{run_id}:
    get:
      tags:
      - Automations
      operationId: getAutomationRun
      summary: Retrieve a run with its steps
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRun'
        default:
          $ref: '#/components/responses/Error'
  /automations/{id}/stop:
    post:
      tags:
      - Automations
      operationId: stopAutomation
      summary: Stop an automation and cancel active runs
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  cancelled_runs:
                    type: integer
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /broadcasts:
    post:
      tags:
      - Broadcasts
      operationId: createBroadcast
      summary: Create a broadcast draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Broadcasts
      operationId: listBroadcasts
      summary: List broadcasts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Broadcast'
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}:
    get:
      tags:
      - Broadcasts
      operationId: getBroadcast
      summary: Retrieve a broadcast
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Broadcasts
      operationId: updateBroadcast
      summary: Update a draft broadcast
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Broadcasts
      operationId: deleteBroadcast
      summary: Delete a draft broadcast
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}/cancel:
    post:
      tags:
      - Broadcasts
      operationId: cancelBroadcast
      summary: Cancel a scheduled, sending or paused broadcast
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}/clicked-links:
    get:
      tags:
      - Broadcasts
      operationId: listBroadcastClickedLinks
      summary: Most clicked links
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClickedLink'
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}/duplicate:
    post:
      tags:
      - Broadcasts
      operationId: duplicateBroadcast
      summary: Duplicate as a new draft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}/performance:
    get:
      tags:
      - Broadcasts
      operationId: getBroadcastPerformance
      summary: Counts, rates and hourly timeline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastPerformance'
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}/recipients:
    get:
      tags:
      - Broadcasts
      operationId: listBroadcastRecipients
      summary: List recipients
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Before'
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - sent
          - delivered
          - opened
          - clicked
          - bounced
          - complained
          - unsubscribed
          - suppressed
      - name: email
        in: query
        required: false
        schema:
          type: string
        description: Substring match on the address.
      - name: bounce_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - permanent
          - transient
          - undetermined
        description: Only with type=bounced.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BroadcastRecipient'
                  has_more:
                    type: boolean
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}/send:
    post:
      tags:
      - Broadcasts
      operationId: sendBroadcast
      summary: Send or schedule a broadcast
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /broadcasts/{id}/test:
    post:
      tags:
      - Broadcasts
      operationId: testBroadcast
      summary: Send one test copy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
              required:
              - to
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /contact-properties:
    get:
      tags:
      - Contact properties
      operationId: listContactProperties
      summary: List contact properties
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactProperty'
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Contact properties
      operationId: createContactProperty
      summary: Create a contact property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                type:
                  type: string
                  enum:
                  - string
                  - number
                  - boolean
                  - date
                fallback_value: {}
              required:
              - key
              - type
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
